name: Bug Report
description: Laporkan bug/issue agar bisa ditriage dan diperbaiki dengan cepat.
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Laporan Bug (Zaenal Alfian Portfolio Project)
        Isi form ini selengkap mungkin agar tim bisa langsung melakukan *reproduce*, menganalisis, dan memperbaiki *error* yang terjadi.

  - type: textarea
    id: summary
    attributes:
      label: Ringkasan Bug
      description: Jelaskan bug secara singkat dan jelas.
      placeholder: "Contoh: Saat membuka detail proyek di /projects/erp-cetakia-platform pada halaman public, gambar preview 404 error."
    validations:
      required: true

  - type: dropdown
    id: affected_route_group
    attributes:
      label: Modul / Area Terdampak
      description: Pilih area modul yang mengalami kendala.
      options:
        - Auth & Session (/admin/login)
        - Halaman Public Home (/)
        - Halaman Projects (/projects, /projects/[slug])
        - Halaman Blogs (/blogs, /blogs/[category]/[slug])
        - Halaman Documentation (/docs, /docs/[category]/[slug])
        - Halaman About (/about)
        - Halaman Experience (/experiences)
        - Halaman Education (/education)
        - Dashboard Admin Main (/admin)
        - Manajemen Projects (/admin/projects)
        - Manajemen Blogs (/admin/blogs)
        - Manajemen Documentation (/admin/docs)
        - Manajemen Experience (/admin/experiences)
        - Manajemen Skillset (/admin/skillsets)
        - Manajemen User Admin (/admin/users)
        - Profil Admin & Kontak (/admin/profile)
        - Tampilan & UI (Japanese Editorial Design / Navigation / Footer / Seigaiha / Modals)
        - API Upload & Public API (/api/upload, /api/profile)
        - Lainnya / Komponen Global
    validations:
      required: true

  - type: input
    id: affected_route_exact
    attributes:
      label: URL / Path Spesifik
      description: Path spesifik tempat error terjadi.
      placeholder: "Contoh: /admin/projects/new atau /blogs/architecture/nextjs-16"
    validations:
      required: true

  - type: checkboxes
    id: affected_layers
    attributes:
      label: Layer Terdampak (Opsional)
      description: Centang jika Anda mengetahui bagian teknis mana yang bermasalah.
      options:
        - label: React Components (UI / Client / Server Components)
        - label: Next.js Pages & Layouts (App Router Next.js 16)
        - label: API Routes / Server Actions
        - label: Database / Prisma Models / Adapter PG
        - label: Styling (Tailwind CSS v4 / Custom CSS)
        - label: Autentikasi (NextAuth)
        - label: Anti-Tamper / ECDSA Security Integrity

  - type: dropdown
    id: scenario
    attributes:
      label: Skenario Kejadian
      description: Pilih aksi apa yang sedang dilakukan saat bug muncul.
      options:
        - Memuat halaman pertama kali (Initial Load / Hydration)
        - Menyimpan/Update Form atau Rich-Text Editor (Tiptap)
        - Filter / Search / Pagination
        - Membuka Modal UI / Pop-up
        - Menekan tombol aksi (Save/Delete/Confirm Modal)
        - Upload gambar / file
        - Autentikasi / Sesi habis
        - Lainnya
    validations:
      required: true

  - type: textarea
    id: reproduce_steps
    attributes:
      label: Langkah Reproduksi (Steps to Reproduce)
      description: Berikan langkah urut agar bug bisa dipicu ulang oleh developer.
      placeholder: |
        1. Login sebagai Admin (/admin/login)
        2. Buka menu Manajemen Projects (/admin/projects)
        3. Klik tombol "Hapus" pada salah satu project
        4. Modal konfirmasi hapus muncul namun data tidak terhapus
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Hasil yang Diharapkan (Expected Behavior)
      placeholder: "Project berhasil dihapus dan tabel ter-update secara otomatis."
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Hasil Aktual (Actual Behavior)
      placeholder: "Halaman langsung freeze dan muncul error di console."
    validations:
      required: true

  - type: textarea
    id: application_logs
    attributes:
      label: Log Error (Opsional)
      description: Cantumkan cuplikan log dari Terminal Next.js (Server) atau Console Browser (DevTools) jika ada.
      placeholder: "Error: PrismaClientKnownRequestError: ..."
      render: shell
    validations:
      required: false

  - type: input
    id: user_role
    attributes:
      label: Role User
      description: Role user yang digunakan saat error terjadi.
      placeholder: "Contoh: Admin / Public (Tanpa Login)"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (Browser/OS)
      description: Informasi perangkat dan browser yang digunakan.
      placeholder: "Contoh: Chrome Desktop macOS / Safari iOS Mobile"
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Dampak Bisnis / Urgensi
      options:
        - Blocker (Fitur utama mati total / Error 500)
        - High (Fungsi terganggu parah, misal page freeze/crash)
        - Medium (Ada fitur gagal tapi masih ada jalan pintas)
        - Low (Hanya isu tampilan/kosmetik)
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Screenshot / Video
      description: Tarik dan lepas (Drag & Drop) gambar atau paste link bukti visual di sini.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist Reporter
      options:
        - label: Saya sudah menuliskan langkah reproduksi yang jelas.
          required: true
        - label: Saya menggunakan issue ini murni untuk melaporkan Bug, bukan Feature Request.
          required: true
